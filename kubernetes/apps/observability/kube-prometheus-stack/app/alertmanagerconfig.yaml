---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: pushover
    repeatInterval: 12h
    routes:
      # InfoInhibitor only exists to inhibit info alerts
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Info alerts are never paged. The inhibit rule below mutes them while
      # InfoInhibitor fires; this route drops any that get through.
      - receiver: blackhole
        matchers:
          - name: severity
            value: info
            matchType: =
      # Watchdog always fires. Re-sending it to Gatus is the heartbeat: if
      # Prometheus or Alertmanager dies, the pushes stop and Gatus notifies
      # Pushover itself. A repeat is due after repeatInterval (2m30s) but only
      # goes out on the next groupInterval (2m) tick, so a push every ~4 min,
      # inside Gatus's 5m heartbeat interval.
      - receiver: gatus-heartbeat
        groupInterval: 2m
        groupWait: 0s
        repeatInterval: 2m30s
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
    groupBy:
      - alertname
      - cluster
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    # kube-prometheus-stack's InfoInhibitor fires while a namespace has info
    # alerts but nothing more severe; it mutes those info alerts.
    - equal:
        - namespace
      sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: =
      targetMatch:
        - name: severity
          value: info
          matchType: =
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =

  receivers:
    - name: blackhole
    - name: gatus-heartbeat
      webhookConfigs:
        - httpConfig:
            bearerTokenSecret:
              name: alertmanager-secret
              key: GATUS_HEARTBEAT_TOKEN
          sendResolved: false
          urlSecret:
            name: alertmanager-secret
            key: GATUS_HEARTBEAT_URL
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
