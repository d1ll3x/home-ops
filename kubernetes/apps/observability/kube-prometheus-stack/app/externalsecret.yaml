---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    # Read by the pushover and gatus-heartbeat receivers in alertmanagerconfig.yaml
    name: alertmanager-secret
    template:
      data:
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        GATUS_HEARTBEAT_TOKEN: "{{ .GATUS_HEARTBEAT_TOKEN }}"
        # In-cluster Service, so the push doesn't depend on envoy, DNS or certificates
        GATUS_HEARTBEAT_URL: http://gatus-sidecar.observability.svc.cluster.local:8080/api/v1/endpoints/heartbeat_alertmanager/external?success=true
  data:
    - secretKey: ALERTMANAGER_PUSHOVER_TOKEN
      remoteRef:
        key: ALERTMANAGER_PUSHOVER_TOKEN
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: PUSHOVER_USER_KEY
    - secretKey: GATUS_HEARTBEAT_TOKEN
      remoteRef:
        key: GATUS_HEARTBEAT_TOKEN
