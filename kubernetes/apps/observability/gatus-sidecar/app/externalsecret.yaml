---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-sidecar
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    # Loaded as env vars (envFrom) and substituted into config.yaml as ${VAR}
    name: gatus-sidecar-secret
  data:
    # Shared with Alertmanager, which sends it as the push's bearer token
    - secretKey: GATUS_HEARTBEAT_TOKEN
      remoteRef:
        key: GATUS_HEARTBEAT_TOKEN
    # Gatus reuses Alertmanager's Pushover application
    - secretKey: GATUS_PUSHOVER_TOKEN
      remoteRef:
        key: ALERTMANAGER_PUSHOVER_TOKEN
    - secretKey: GATUS_PUSHOVER_USER_KEY
      remoteRef:
        key: PUSHOVER_USER_KEY
