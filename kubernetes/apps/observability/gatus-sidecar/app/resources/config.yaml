---
# Dead man's switch: Alertmanager's always-firing Watchdog alert is pushed to
# this external endpoint (key heartbeat_alertmanager), about every 4 min. Each
# 5m heartbeat interval without a push is a failure; after two (~10-20 min after
# the last push) Gatus notifies Pushover directly: no Alertmanager involved.
alerting:
  pushover:
    application-token: ${GATUS_PUSHOVER_TOKEN}
    user-key: ${GATUS_PUSHOVER_USER_KEY}
    title: Gatus
    priority: 1
    resolved-priority: 0
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h
      send-on-resolved: true

# Gatus needs at least one regular endpoint. These two also say which half
# broke when the heartbeat stops. They use the operators' governing Services,
# which exist for any Prometheus/Alertmanager CR.
endpoints:
  - name: prometheus
    group: observability
    url: http://prometheus-operated.observability.svc.cluster.local:9090/-/healthy
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover
        description: Prometheus /-/healthy failing

  - name: alertmanager
    group: observability
    url: http://alertmanager-operated.observability.svc.cluster.local:9093/-/healthy
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover
        description: Alertmanager /-/healthy failing

external-endpoints:
  - name: alertmanager
    group: heartbeat
    token: ${GATUS_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover
        description: Watchdog heartbeat missed (Prometheus or Alertmanager down?)
        failure-threshold: 2

metrics: true

storage:
  type: memory

ui:
  title: Status | Gatus
  header: odysseus

web:
  port: ${GATUS_WEB_PORT}
