---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  labels:
    # Opts out of the HelmRelease defaults patch in flux-instance (its
    # RemediateOnFailure rollback); see upgrade below.
    home-ops/helm-defaults: skip
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  # Longhorn's upgrade waits on its manager DaemonSet and hook jobs; the 5m
  # default is too short on a busy node.
  timeout: 15m
  # Longhorn can't be downgraded: a rollback after a failed or timed-out
  # upgrade leaves storage down. So never roll back; retry the upgrade instead.
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    defaultBackupStore:
      # Encryption is the bucket's default (Scaleway-managed keys); Longhorn sends no SSE headers.
      backupTarget: s3://longhorn@nl-ams/
      backupTargetCredentialSecret: longhorn-backup-secret
    defaultSettings:
      # Recurring backups attach a detached volume (e.g. a scaled-to-zero app)
      # to back it up. A pod starting meanwhile may wait for the backup, or
      # interrupt it; an interrupted backup is retried the next night.
      allowRecurringJobWhileVolumeDetached: true
      defaultDataPath: /var/mnt/longhorn # the Talos UserVolumeConfig "longhorn"
      defaultReplicaCount: 1 # one node until M10 (#26); 3 would leave every volume degraded
      storageReservedPercentageForDefaultDisk: 10 # the disk is dedicated to Longhorn
    longhornGlobalManager:
      replicas: 1 # standbys only help with more than one node
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
    persistence:
      # The chart-managed "longhorn" class: the manager reconciles it from a
      # ConfigMap, so raising the replica count in M10 is a values change.
      defaultClass: true
      defaultClassReplicaCount: 1
      defaultDataLocality: best-effort
