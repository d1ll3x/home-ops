---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  labels:
    # Opts out of the flux-instance HelmRelease defaults (rollback on failure)
    home-ops/helm-defaults: skip
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  # The upgrade waits on the manager DaemonSet and hook jobs; 5m is too short
  timeout: 15m
  # Longhorn can't be downgraded, so retry a failed upgrade instead of rolling back
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    defaultBackupStore:
      # Encrypted by the bucket default (Scaleway-managed keys)
      backupTarget: s3://longhorn@nl-ams/
      backupTargetCredentialSecret: longhorn-backup-secret
    defaultSettings:
      # Back up scaled-to-zero apps too; an interrupted backup retries the next night
      allowRecurringJobWhileVolumeDetached: true
      defaultDataPath: /var/mnt/longhorn # the Talos UserVolumeConfig "longhorn"
      defaultReplicaCount: 1 # one node until M10 (#26); 3 would leave every volume degraded
      storageReservedPercentageForDefaultDisk: 10 # the disk is dedicated to Longhorn
    longhornGlobalManager:
      replicas: 1 # standbys only help with more than one node
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
    persistence:
      # The chart-managed "longhorn" class; raise its replica count here in M10
      defaultClass: true
      defaultClassReplicaCount: 1
      defaultDataLocality: best-effort
