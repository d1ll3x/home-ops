---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
# Longhorn publishes its chart only to this Helm repository (no OCI chart),
# so this app uses HelmRepository + chart.spec instead of OCIRepository + chartRef.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 1h
  url: https://charts.longhorn.io
