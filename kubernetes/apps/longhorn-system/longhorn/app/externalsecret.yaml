---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    # Read by defaultBackupStore.backupTargetCredentialSecret
    name: longhorn-backup-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .SCW_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .SCW_SECRET_KEY }}"
        # Set without VIRTUAL_HOSTED_STYLE, so backups use path-style requests
        AWS_ENDPOINTS: https://s3.nl-ams.scw.cloud
  data:
    - secretKey: SCW_ACCESS_KEY
      remoteRef:
        key: SCW_ACCESS_KEY
    - secretKey: SCW_SECRET_KEY
      remoteRef:
        key: SCW_SECRET_KEY
