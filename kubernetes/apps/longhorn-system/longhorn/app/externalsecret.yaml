---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    # Read by the backup target (defaultBackupStore.backupTargetCredentialSecret)
    name: longhorn-backup-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .LONGHORN_S3_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .LONGHORN_S3_SECRET_ACCESS_KEY }}"
        # Scaleway's S3 endpoint. With it set and VIRTUAL_HOSTED_STYLE unset,
        # Longhorn's backupstore sends path-style requests (s3.nl-ams.scw.cloud/longhorn/...)
        AWS_ENDPOINTS: https://s3.nl-ams.scw.cloud
  data:
    - secretKey: LONGHORN_S3_ACCESS_KEY_ID
      remoteRef:
        key: LONGHORN_S3_ACCESS_KEY_ID
    - secretKey: LONGHORN_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: LONGHORN_S3_SECRET_ACCESS_KEY
