---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/storage.k8s.io/storageclass_v1.json
# Local-only volumes: one replica that stays on the pod's node. For data that is
# replicated or disposable at the application level (CNPG, Prometheus), so it
# never takes the network path. Replicated volumes use the chart's "longhorn" class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-local
provisioner: driver.longhorn.io
parameters:
  dataEngine: v1
  dataLocality: strict-local
  fsType: ext4
  numberOfReplicas: "1"
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
