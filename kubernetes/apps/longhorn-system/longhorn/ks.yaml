---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
spec:
  dependsOn:
    # Longhorn's csi-snapshotter sidecar needs the VolumeSnapshot CRDs
    - name: snapshot-controller
      namespace: kube-system
  # Not wait: true, so a missing backup secret can't block the StorageClasses
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/longhorn-system/longhorn/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: longhorn
    namespace: flux-system
  targetNamespace: longhorn-system
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
spec:
  dependsOn:
    # RecurringJob is a Longhorn CRD, installed by the chart
    - name: longhorn
  interval: 1h
  path: ./kubernetes/apps/longhorn-system/longhorn/config
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: longhorn
    namespace: flux-system
  targetNamespace: longhorn-system
  wait: true
