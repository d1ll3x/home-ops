---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

components:
  - ../../components/alerts
  - ../../components/namespace

resources:
  - ./longhorn/ks.yaml

patches:
  # Longhorn's manager, instance-manager and CSI pods are privileged (host /
  # mount, iSCSI, block devices). Talos sets no Pod Security admission default
  # today (no KubeAdmissionControlConfig in our templates); the labels are
  # explicit, so a future PSA default can't break storage. Strategic merge only
  # adds these keys; `name: _` is ignored because `target` selects the Namespace.
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
