---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.4
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h
  values:
    installCRDs: true
    oauthSecretVolume:
      secret:
        secretName: tailscale-operator-secret
    operatorConfig:
      hostname: homelab-tailscale-operator
      defaultTags:
        - tag:k8s-operator
    proxyConfig:
      defaultTags: tag:k8s
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
