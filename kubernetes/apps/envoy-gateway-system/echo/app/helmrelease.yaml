---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    replicaCount: 2
    config:
      kubernetes: true
      trustedProxies:
        # Pod CIDR (Talos podSubnets): Envoy proxies forward from pod IPs
        - 10.42.0.0/16
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      hostnames:
        - echo.tebbenet.nl
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway-system
          # Same namespace as the Gateway, so pin https or plain HTTP skips the redirect
          sectionName: https
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
