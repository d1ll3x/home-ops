---
# A PVC named ${APP} that joins Longhorn's opt-in "backup" recurring-job group
# (daily backup to Scaleway, 14 kept). The app mounts it as existingClaim: ${APP}.
# Needs postBuild.substitute.APP and dependsOn longhorn-config (longhorn-system).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  labels:
    recurring-job-source.longhorn.io: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ${LONGHORN_ACCESSMODES:=ReadWriteOnce}
  resources:
    requests:
      storage: ${LONGHORN_CAPACITY:=5Gi}
  storageClassName: ${LONGHORN_STORAGECLASS:=longhorn}
