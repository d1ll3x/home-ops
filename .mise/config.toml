[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[hooks]
postinstall = "lefthook install"

[tools]
talosctl = "1.14.4"
kubectl = "1.37.1"
helmfile = "1.8.3"
oxfmt = "0.75.0"
lefthook = "2.2.2"
cilium-hubble = "1.20.4"
cilium-cli = "0.20.2"
flux2 = "2.10.0"
zizmor = "1.32.0"
"aqua:mitsuhiko/minijinja" = "3.0.5" # minijinja-cli: renders talos/*.j2 under fnox exec
