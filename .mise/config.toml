[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
JUST_UNSTABLE = "1"

[tools]
talosctl = "1.14.4"
kubectl = "1.37.1"
helmfile = "latest"
yamlfmt = "latest"

cilium-hubble = "latest"
cilium-cli = "latest"
flux2 = "latest"
"aqua:mitsuhiko/minijinja" = "latest"    # minijinja-cli: renders talos/*.j2 under fnox exec
