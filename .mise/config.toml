[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[hooks]
postinstall = "lefthook install"

[tools]
talosctl = "1.14.6"
kubectl = "1.37.2"
gum = "2.0.2"
oxfmt = "0.80.0"
lefthook = "2.2.2"
just = "1.59.0"
fnox = "1.50.0"
bitwarden-secrets-manager = "2.1.0"
k9s = "0.51.0"
kustomize = "5.8.3"
kubeconform = "0.8.0"
helm = "4.3.2"
helmfile = "1.8.4"
yq = "4.54.3"
shellcheck = "0.11.0"
scaleway-cli = "2.67.0"
cilium-hubble = "1.20.4"
cilium-cli = "0.20.2"
flux2 = "2.10.0"
zizmor = "1.32.0"
terraform = "1.17.2"
tflint = "0.66.0"
node = "26.13.0"
"aqua:mitsuhiko/minijinja" = "3.0.5" # minijinja-cli: renders talos/*.j2 under fnox exec
