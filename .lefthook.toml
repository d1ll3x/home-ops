[pre-commit]
parallel = true
skip = ["merge", "rebase"]

# Sequential: mise lock reading the config mid-fmt prunes every tool from the lockfile
[[pre-commit.jobs]]
name = "mise"
glob = [".mise/config.toml", ".mise/conf.d/*.toml", "**/mise.toml"]

[pre-commit.jobs.group]
piped = true

[[pre-commit.jobs.group.jobs]]
name = "format-mise"
# mise fmt skips nested configs; capturing first leaves the file untouched when it fails
run = '''
for f in {staged_files}; do
  out="$(mise fmt --stdin <"$f")" || exit 1
  printf '%s\n' "$out" >"$f"
done
'''
stage_fixed = true

[[pre-commit.jobs.group.jobs]]
name = "lock-mise"
run = 'mise lock && git add -A -- .mise ":(exclude).mise/*.toml"'

[pre-commit.commands.format-oxfmt]
glob = [
  "*.json",
  "*.json5",
  "*.jsonc",
  "*.md",
  "*.markdown",
  "*.mdx",
  "*.yaml",
  "*.yml",
]
# Lock sidecars are digest-pinned; reformatting breaks `mise install --locked`
exclude = [".mise/locks/**"]
# Exit zero when every staged path is on oxfmt's ignore list
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.format-terraform]
glob = ["*.tf", "*.tfvars", "*.tftest.hcl"]
run = "terraform fmt {staged_files}"
stage_fixed = true

[pre-commit.commands.zizmor]
glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml"]
run = "zizmor --offline {staged_files}"
